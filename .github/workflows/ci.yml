name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race ./...

  frontend:
    name: Type-check and build the UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # npm run build runs tsc --noEmit first, so this covers the type-check.
      - name: Build
        working-directory: frontend
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The API is started in the background and given a moment to bind before
      # the smoke test starts calling it.
      - name: Start the API
        working-directory: backend
        env:
          ESTIMEET_ADDR: 127.0.0.1:8090
          ESTIMEET_DB_PATH: ${{ runner.temp }}/smoke.db
          ESTIMEET_SECRET: ci-secret-value-at-least-16
        run: |
          go run ./cmd/server &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8090/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the API never became healthy"
          exit 1

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A build only, with no login and no push: pull requests from forks must
      # never be able to publish an image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
